server.address=127.0.0.1
server.port=8091
spring.application.name=flowable-rest

spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/${FLOWABLE_DB_NAME}
spring.datasource.username=${FLOWABLE_DB_USER}
spring.datasource.password=${FLOWABLE_DB_PASSWORD}

flowable.database-schema-update=true
flowable.rest.app.authentication-mode=any-user
flowable.rest.app.admin.user-id=${FLOWABLE_REST_USER}
flowable.rest.app.admin.password=${FLOWABLE_REST_PASSWORD}
flowable.rest.app.admin.first-name=FlowCore
flowable.rest.app.admin.last-name=REST
